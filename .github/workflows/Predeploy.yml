name: Invento CI/CD Pipeline

on:
  push:
    branches: ["PreDeploy"]
  pull_request:
    branches: ["PreDeploy"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env File
        run: |
          touch .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${{ secrets.DB_NAME }};Username=${{ secrets.DB_USER }};Password=${{ secrets.DB_PASSWORD }}" >> .env
          echo "ConnectionStrings__RedisConnection=redis:6379" >> .env
          echo "JWT_KEY=${{ secrets.JWT_KEY }}" >> .env
          echo "JWT_ISSUER=InventoBackend" >> .env
          echo "JWT_AUDIENCE=InventoAngularClient" >> .env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env

      - name: Inject GitHub Client ID
        run: |
          sed -i "s/GITHUB_ID_PLACEHOLDER/${{ secrets.My_GITHUB_CLIENT_ID }}/g" Front/src/app/environment.ts

      - name: Restore and Build
        run: |
          dotnet restore 
          dotnet build --configuration Release

      - name: Verify Config File
        run: cat Front/nginxx.conf
      - name: Test Docker Compose Up
        run: |
          echo "Starting containers..."
          docker compose up -d
          echo "Waiting for containers to be ready..."
          for i in {1..12}; do
            echo "--- Checking Status (Attempt $i/12) ---"
            docker compose ps
            EXITED=$(docker ps -a -f status=exited -q | wc -l)  
            if [ "$EXITED" -gt 0 ]; then
              echo "Detected a failed container. Capturing diagnostics..."
              break
            fi
            sleep 5
          done
          echo "Final container status (Detailed):"
          docker compose ps -a
          EXITED_IDS=$(docker ps -a -f status=exited -q)

          if [ -n "$EXITED_IDS" ]; then
            echo "::error::One or more containers failed! Analyzing..."
            echo "::group::Technical Post-Mortem (Inspect)"
            docker inspect $EXITED_IDS --format 'Container: {{.Name}} | ExitCode: {{.State.ExitCode}} | Error: {{.State.Error}}'
            echo "::endgroup::"
            echo "::group::Frontend Logs (The suspicious one)"
            docker logs invento-frontend
            echo "::endgroup::"
            echo "::group::API Logs"
            docker logs invento-api
            echo "::endgroup::"
            echo "::group::Database Logs"
            docker logs invento-db
            echo "::endgroup::"
            echo "::group::Docker Network Status"
            docker network inspect invento-network
            echo "::endgroup::"
            exit 1
          fi
          echo "Success: All containers are up and healthy!"

      - name: Shutdown Test Environment
        run: docker compose down

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Presentation/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/invento-api:latest
            ${{ secrets.DOCKER_USERNAME }}/invento-api:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Front
          file: ./Front/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/invento-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/invento-frontend:${{ github.sha }}
