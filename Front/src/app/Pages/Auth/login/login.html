<app-photo imgSrc="/assets/images/background.webp">
  <div class="flex items-center justify-center p-8 font-sans w-full min-h-[90vh]">
    <div
      class="max-w-lg w-full bg-white/80 backdrop-blur-xl rounded-[2.5rem] shadow-2xl shadow-black/10 overflow-hidden border border-white/40"
    >
      <div class="bg-slate-900/90 py-12 text-center">
        <h1 class="text-4xl font-black text-white tracking-tighter italic">INVENTO</h1>
        <p class="text-blue-400 mt-3 text-[10px] uppercase tracking-[0.4em] font-bold opacity-80">
          Enterprise Logistics Terminal
        </p>
      </div>

      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        class="p-12 space-y-9"
        id="LoginForm"
        aria-label="Login-Form"
      >
        <!-- سكشن بيانات الدخول -->
        <section id="CredentialsSection" aria-label="User-Credentials" class="space-y-9">
          <h2 id="login-credentials" class="sr-only">Login Credentials</h2>

          <!-- Email Group -->
          <fieldset id="EmailField" aria-label="Email-Group" class="space-y-4 border-none p-0 m-0">
            <label for="email" class="block text-xs font-black uppercase tracking-[0.15em] ml-2">
              Corporate Email
            </label>
            <div id="EmailInputWrapper" aria-label="Email-Relative-Group" class="relative group">
              <!-- SVG Icon -->
              <span
                class="absolute inset-y-0 left-0 pl-5 flex items-center text-slate-400 group-focus-within:text-blue-600 transition-all duration-300"
                aria-hidden="true"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-6 w-6"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                  />
                </svg>
              </span>
              <input
                id="email"
                type="email"
                formControlName="email"
                class="w-full pl-14 pr-6 py-5 bg-white/50 border border-slate-200/60 rounded-2xl focus:bg-white focus:ring-8 focus:ring-blue-500/5 focus:border-blue-500 transition-all duration-300 outline-none text-slate-700 font-medium text-lg placeholder:text-slate-300 shadow-sm"
                placeholder="name@company.com"
              />
            </div>
          </fieldset>

          <!-- Password Group -->
          <fieldset
            id="PasswordField"
            aria-label="Password-Group"
            class="space-y-4 border-none p-0 m-0"
          >
            <label for="password" class="block text-xs font-black uppercase tracking-[0.15em] ml-2">
              Secure Password
            </label>
            <div
              id="PasswordInputWrapper"
              aria-label="Password-Relative-Group"
              class="relative group"
            >
              <!-- SVG Icon -->
              <span
                class="absolute inset-y-0 left-0 pl-5 flex items-center text-slate-400 group-focus-within:text-blue-600 transition-all duration-300"
                aria-hidden="true"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-6 w-6"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                  />
                </svg>
              </span>
              <input
                id="password"
                type="password"
                formControlName="password"
                class="w-full pl-14 pr-6 py-5 bg-white/50 border border-slate-200/60 rounded-2xl focus:bg-white focus:ring-8 focus:ring-blue-500/5 focus:border-blue-500 transition-all duration-300 outline-none text-slate-700 font-medium text-lg placeholder:text-slate-300 shadow-sm"
                placeholder="••••••••"
              />
            </div>
          </fieldset>
        </section>

        <!-- سكشن الأفعال -->
        <section id="ActionsSection" aria-label="Form-Actions" class="pt-6 space-y-6">
          <button
            id="SubmitBtn"
            aria-label="Submit-Login-Button"
            type="submit"
            [disabled]="form.invalid"
            class="w-full py-5 hover:bg-blue-600 disabled:bg-slate-200 text-black font-black rounded-2xl transition-all duration-500 shadow-xl shadow-slate-900/10 hover:shadow-blue-500/30 active:scale-[0.97] uppercase tracking-[0.3em] text-sm"
          >
            Login
          </button>

          <!-- Captcha -->
          <!-- Captcha Container -->
          <figure
            id="CaptchaWrapper"
            aria-label="ReCaptcha-Challenge"
            class="flex justify-center py-4"
          >
            <div id="InventoCaptcha"></div>
          </figure>

          <div id="Divider" aria-label="Auth-Divider" class="relative py-4 flex items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span
              class="flex-shrink mx-4 text-slate-400 text-[10px] uppercase tracking-widest font-bold"
              >OR</span
            >
            <div class="flex-grow border-t border-slate-200"></div>
          </div>

          <!-- External Auth -->
          <button
            id="GithubBtn"
            aria-label="Login-With-Github"
            type="button"
            (click)="ExternalAuth()"
            class="w-full py-4 bg-white hover:bg-slate-50 border-2 border-slate-100 text-black font-bold rounded-2xl transition-all duration-300 flex items-center justify-center gap-3 shadow-sm hover:shadow-md active:scale-[0.98]"
          >
            <img
              src="/assets/images/github.webp"
              alt=""
              width="40"
              height="40"
              aria-hidden="true"
            />
            <span class="text-xs uppercase tracking-widest">login with Github</span>
          </button>
        </section>

        <!-- روابط إضافية -->
        <footer id="FormFooter" aria-label="Registration-Link" class="text-center pt-4">
          <p class="text-[11px] font-bold uppercase tracking-widest">
            New to the system?
            <a
              routerLink="/register"
              id="RegisterLink"
              class="text-blue-600 hover:text-blue-800 ml-1 underline underline-offset-8 decoration-2 transition-all"
              >Create Account</a
            >
          </p>
        </footer>
      </form>
    </div>
  </div>
</app-photo>
