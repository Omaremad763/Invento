    <div class="flex items-center justify-between px-4 py-3 bg-white border-t border-slate-200 sm:px-6 rounded-b-2xl">
      <div class="flex flex-1 justify-between sm:hidden">
        <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1" class="btn-mobile">Previous</button>
        <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === totalPages" class="btn-mobile">Next</button>
      </div>
      
      <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
        <div>
          <p class="text-sm text-slate-700">
            Showing <span class="font-semibold">{{ (currentPage - 1) * pageSize + 1 }}</span> 
            to <span class="font-semibold">{{ Math.min(currentPage * pageSize, totalCount) }}</span> 
            of <span class="font-semibold">{{ totalCount }}</span> results
          </p>
        </div>
        
        <div>
          <nav class="isolate inline-flex -space-x-px rounded-md shadow-sm" aria-label="Pagination">
            @for (page of pages; track page) {
              <button 
                (click)="changePage(page)"
                [class.bg-blue-600]="page === currentPage"
                [class.text-white]="page === currentPage"
                [class.text-slate-900]="page !== currentPage"
                class="relative inline-flex items-center px-4 py-2 text-sm font-semibold border border-slate-300 hover:bg-slate-50 focus:z-20 transition-colors">
                {{ page }}
              </button>
            }
          </nav>
        </div>
      </div>
    </div>
