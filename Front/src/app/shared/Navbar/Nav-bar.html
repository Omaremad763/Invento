<div class="flex h-screen bg-slate-50 overflow-hidden font-sans">
  <aside 
    [class.w-64]="isSidebarOpen" 
    [class.w-20]="!isSidebarOpen"
    class="bg-slate-900 text-slate-300 transition-all duration-300 ease-in-out flex flex-col shadow-2xl z-50">
    
    <div class="h-16 flex items-center px-6 bg-slate-950/50 border-b border-slate-800">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shrink-0">I</div>
      <span *ngIf="isSidebarOpen" class="ml-3 font-extrabold text-xl tracking-wider text-white">INVENTO</span>
    </div>

    <nav class="flex-1 mt-6 px-3 space-y-2 overflow-y-auto custom-scrollbar">
      <a *ngFor="let item of menuItems" 
         [routerLink]="item.route" 
         routerLinkActive="bg-blue-600 text-white shadow-lg shadow-blue-900/20"
         [routerLinkActiveOptions]="{exact: true}"
         class="flex items-center p-3 rounded-xl transition-all duration-200 hover:bg-slate-800 group relative">
        
        <i [class]="'fa-solid fa-' + item.icon" class="text-lg w-6 text-center shrink-0"></i>
        
        <span *ngIf="isSidebarOpen" class="ml-3 font-medium text-sm whitespace-nowrap overflow-hidden">
          {{ item.label }}
        </span>

        <span *ngIf="!isSidebarOpen" 
              class="absolute left-16 bg-slate-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity z-[100] pointer-events-none whitespace-nowrap border border-slate-700">
          {{ item.label }}
        </span>
      </a>
    </nav>
  </aside>

  <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm">
      <div class="flex items-center gap-4">
        <h2 class="text-slate-500 font-medium text-sm uppercase tracking-widest"><span class="text-slate-900">Dashboard</span></h2>
      </div>

      <div class="flex items-center gap-4">
        <div class="flex flex-col items-end mr-2">
          <span class="text-sm font-bold text-slate-800">Admin User</span>
          <span class="text-[10px] text-green-500 font-bold uppercase tracking-tighter">● Online</span>
        </div>
        <div class="w-10 h-10 rounded-full bg-slate-100 border-2 border-white shadow-sm flex items-center justify-center text-slate-500 font-bold italic">
          AU
        </div>
      </div>
    </header>

    <section class="flex-1 overflow-y-auto p-6 md:p-8 bg-slate-50">
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </section>
  </main>
</div>
